services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outage
      POSTGRES_PASSWORD: outage
      POSTGRES_DB: outage
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # runs 01_schema.sql then 02_seed.sql on first start
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage -d outage"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://outage:outage@db:5432/outage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
