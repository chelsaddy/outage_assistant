# Secrets come from .env (see .env.example); compose refuses to start without POSTGRES_PASSWORD.
# Ports are published on 127.0.0.1 only, so nothing else on the network can reach them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: outage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: outage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # runs 01_schema.sql then 02_seed.sql on first start
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage -d outage"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://outage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/outage
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true                    # the API writes nothing to disk
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
